<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppy Dreams Status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%2322a06b'/></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e3e6eb;
    --text: #1b1f24;
    --muted: #5f6b7a;
    --up: #1f9d61;
    --slow: #c98a06;
    --down: #d6373a;
    --none: #d5d9df;
    --up-soft: #e6f5ee;
    --slow-soft: #fdf4e0;
    --down-soft: #fcebeb;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #171b21;
      --border: #272d36;
      --text: #e7eaee;
      --muted: #97a1ad;
      --up: #35c07f;
      --slow: #e3a82b;
      --down: #f0585b;
      --none: #323944;
      --up-soft: #16301f;
      --slow-soft: #332811;
      --down-soft: #3a1a1b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 13px; }
  .banner {
    margin: 20px 0 24px;
    padding: 16px 18px;
    border-radius: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .banner.up { background: var(--up-soft); color: var(--up); }
  .banner.slow { background: var(--slow-soft); color: var(--slow); }
  .banner.down { background: var(--down-soft); color: var(--down); }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .toolbar button, .toolbar input {
    font: inherit;
    font-size: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
  }
  .toolbar input { border-radius: 8px; flex: 1 1 200px; min-width: 0; }
  .toolbar button { cursor: pointer; }
  .toolbar button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 28px 0 10px; }
  .list { display: grid; gap: 10px; }
  .site {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--none);
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) 250px;
    gap: 16px;
    align-items: center;
  }
  .site.up { border-left-color: var(--up); }
  .site.slow { border-left-color: var(--slow); }
  .site.down { border-left-color: var(--down); }
  .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--none); flex: none; }
  .up .dot { background: var(--up); }
  .slow .dot { background: var(--slow); }
  .down .dot { background: var(--down); box-shadow: 0 0 0 4px var(--down-soft); }
  .url { color: var(--muted); font-size: 13px; text-decoration: none; overflow-wrap: anywhere; }
  .url:hover { text-decoration: underline; }
  .err { color: var(--down); font-size: 13px; margin-top: 4px; }
  .bars { display: flex; gap: 2px; height: 28px; align-items: stretch; justify-content: flex-end; }
  .bars span { flex: 1; border-radius: 2px; background: var(--none); min-width: 2px; max-width: 10px; }
  .bars span.ok { background: var(--up); }
  .bars span.slow { background: var(--slow); }
  .bars span.bad { background: var(--down); }
  .bars-caption { display: flex; justify-content: flex-end; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.7fr; gap: 4px 18px; text-align: right; font-variant-numeric: tabular-nums; }
  .stats .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stats .v { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .warn { color: var(--slow); }
  .bad-text { color: var(--down); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .inv { grid-column: 1 / -1; border-top: 1px solid var(--border); padding-top: 10px; font-size: 13px; }
  .inv summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .inv summary::-webkit-details-marker { display: none; }
  .inv:not([open]) summary .more::after { content: "Show details"; }
  .inv[open] summary .more::after { content: "Hide details"; }
  .inv .more { color: var(--muted); text-decoration: underline; }
  .inv .plain { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .pill { font-weight: 600; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .pill.in_sync { background: var(--up-soft); color: var(--up); }
  .pill.pending { background: var(--slow-soft); color: var(--slow); }
  .pill.out_of_sync, .pill.error { background: var(--down-soft); color: var(--down); }
  .inv h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 12px 0 4px; }
  .inv ul { margin: 0; padding-left: 18px; }
  .inv li { margin: 2px 0; }
  .inv .id { color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) {
    .site { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(4, 1fr); text-align: left; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Puppy Dreams Status</h1>
    <div class="meta" id="updated">Loading…</div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="totals" id="totals"></div>

  <div class="toolbar" id="toolbar">
    <input id="search" type="search" placeholder="Search sites…" aria-label="Search sites">
  </div>

  <div id="groups"></div>
</main>

<script>
const REFRESH_MS = 60000; // look for new data every minute (checks run every ~5 min)
const STALE_MS = 20 * 60000; // checks normally land every ~5 min; warn if none for 20
let lastVersion = "";
let data = null;
let inventory = null;
const openDetails = new Set(); // keeps inventory panels open across re-renders
let filter = "all";
let query = "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v == null ? "—" : `${v.toFixed(v === 100 ? 0 : 2)}%`);

function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 48) return `${h} h ago`;
  return `${Math.round(h / 24)} days ago`;
}

function duration(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${m} min`;
  if (m < 60 * 48) return `${Math.round(m / 60)} h`;
  return `${Math.round(m / 1440)} days`;
}

const invFor = (site) => inventory?.stores?.find((x) => x.url === site.url);
const invLabel = { in_sync: "Inventory in sync", pending: "Syncing…", out_of_sync: "Inventory out of sync", error: "Inventory check failed" };

function inventoryRow(site) {
  const inv = invFor(site);
  if (!inv) return "";
  const counts = inv.status === "error" ? "" : `<span>${inv.siteCount} on site · ${inv.pinogyCount} in Pinogy</span>`;
  const checked = `<span class="meta">checked ${ago(inv.checkedAt)}</span>`;
  const pill = `<span class="pill ${inv.status}">${invLabel[inv.status]}</span>`;
  if (inv.status === "error") {
    return `<div class="inv"><div class="plain">${pill}<span class="err">${esc(inv.error)}</span>${checked}</div></div>`;
  }
  const problems = [
    inv.missing.length && `${inv.missing.length} missing`,
    inv.stale.length && `${inv.stale.length} stale`,
    inv.price.length && `${inv.price.length} price`,
  ].filter(Boolean);
  if (!problems.length) return `<div class="inv"><div class="plain">${pill}${counts}${checked}</div></div>`;

  const item = (p, extra = "") => `<li>${esc(p.name || "(no name)")} · ${esc(p.breed || "unknown breed")} <span class="id">#${esc(p.id)}</span>${extra} <span class="meta">since ${ago(p.since)}</span></li>`;
  const section = (title, list, fmt = (p) => item(p)) => list.length ? `<h3>${title} (${list.length})</h3><ul>${list.map(fmt).join("")}</ul>` : "";
  return `
    <details class="inv" data-url="${esc(site.url)}" ${openDetails.has(site.url) ? "open" : ""}>
      <summary>${pill}<span class="${inv.status === "out_of_sync" ? "bad-text" : "warn"}">${problems.join(" · ")}</span>${counts}${checked}<span class="more"></span></summary>
      ${section("In Pinogy, missing from the site", inv.missing)}
      ${section("On the site, not available in Pinogy", inv.stale)}
      ${section("Price differs", inv.price, (p) => item(p, ` — Pinogy $${p.price}, site $${p.sitePrice}`))}
    </details>`;
}

function renderTotals(sites) {
  const down = sites.filter((s) => s.status === "down").length;
  const slow = sites.filter((s) => s.status === "slow").length;
  const avgUptime = sites.filter((s) => s.uptime.day != null);
  const uptimeDay = avgUptime.length ? avgUptime.reduce((a, s) => a + s.uptime.day, 0) / avgUptime.length : null;
  const times = sites.filter((s) => s.status !== "down").map((s) => s.ms);
  const invStores = inventory?.stores || [];
  const outOfSync = invStores.filter((x) => x.status === "out_of_sync" || x.status === "error").length;

  const banner = $("banner");
  banner.hidden = false;
  if (down) {
    banner.className = "banner down";
    banner.textContent = `${down} of ${sites.length} site${sites.length > 1 ? "s" : ""} down`;
  } else if (slow || outOfSync) {
    banner.className = "banner slow";
    banner.textContent = [
      "All sites up",
      slow && `${slow} responding slowly`,
      outOfSync && `${outOfSync} store${outOfSync > 1 ? "s" : ""} with inventory problems`,
    ].filter(Boolean).join(" · ");
  } else {
    banner.className = "banner up";
    banner.textContent = `All ${sites.length} sites operational`;
  }

  $("totals").innerHTML = [
    ["Sites", sites.length],
    ["Up", sites.length - down],
    ["Down", down, down ? "bad-text" : ""],
    ["Uptime (24h)", pct(uptimeDay)],
    ["Avg response", times.length ? `${Math.round(times.reduce((a, b) => a + b, 0) / times.length)} ms` : "—"],
    ...(invStores.length ? [["Inventory in sync", `${invStores.filter((x) => x.status === "in_sync").length}/${invStores.length}`, outOfSync ? "bad-text" : ""]] : []),
  ].map(([k, v, cls = ""]) => `<div class="tile"><div class="label">${k}</div><div class="value ${cls}">${v}</div></div>`).join("");
}

const hasInventoryProblem = (site) => ["out_of_sync", "pending", "error"].includes(invFor(site)?.status);

function renderToolbar(sites) {
  const counts = { all: sites.length, down: 0, slow: 0, up: 0 };
  sites.forEach((s) => counts[s.status]++);
  counts.inventory = sites.filter(hasInventoryProblem).length;
  const buttons = [["all", "All"], ["down", "Down"], ["slow", "Slow"], ["up", "Up"], ...(inventory ? [["inventory", "Inventory issues"]] : [])]
    .map(([key, label]) => `<button data-filter="${key}" aria-pressed="${filter === key}">${label} ${counts[key]}</button>`).join("");
  const toolbar = $("toolbar");
  toolbar.querySelectorAll("button").forEach((b) => b.remove());
  toolbar.insertAdjacentHTML("afterbegin", buttons);
}

function siteRow(s) {
  const bars = s.recent.map(([t, ok, ms]) => {
    const cls = !ok ? "bad" : ms > 5000 ? "slow" : "ok";
    const when = new Date(t).toLocaleString();
    return `<span class="${cls}" title="${esc(when)} — ${ok ? `${ms} ms` : "down"}"></span>`;
  }).join("");
  const firstT = s.recent[0]?.[0];
  const ssl = s.sslDaysLeft == null
    ? "—"
    : `<span class="${s.sslDaysLeft < 7 ? "bad-text" : s.sslDaysLeft < 21 ? "warn" : ""}">${s.sslDaysLeft}d</span>`;
  const stateText = s.status === "down"
    ? `Down for ${duration(s.since)}`
    : `Up for ${duration(s.since)}`;

  return `
    <article class="site ${s.status}">
      <div>
        <div class="name"><span class="dot" aria-hidden="true"></span>${esc(s.name)}</div>
        <a class="url" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//, ""))}</a>
        <div class="meta">${stateText}</div>
        ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
      </div>
      <div>
        <div class="bars" role="img" aria-label="Last ${s.recent.length} checks">${bars}</div>
        <div class="bars-caption"><span>${firstT ? `${ago(new Date(firstT).toISOString())} → now` : ""}</span></div>
      </div>
      <div class="stats">
        <div class="k">Response</div><div class="k">24h</div><div class="k">7d</div><div class="k">SSL</div>
        <div class="v">${s.status === "down" ? "—" : `${s.ms} ms`}</div>
        <div class="v">${pct(s.uptime.day)}</div>
        <div class="v">${pct(s.uptime.week)}</div>
        <div class="v">${ssl}</div>
      </div>
      ${inventoryRow(s)}
    </article>`;
}

function renderSites(sites) {
  const q = query.trim().toLowerCase();
  const shown = sites
    .filter((s) => filter === "all" || s.status === filter || (filter === "inventory" && hasInventoryProblem(s)))
    .filter((s) => !q || s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q))
    // Problems first, then alphabetical.
    .sort((a, b) => ({ down: 0, slow: 1, up: 2 }[a.status] - { down: 0, slow: 1, up: 2 }[b.status]) || a.name.localeCompare(b.name));

  if (!shown.length) {
    $("groups").innerHTML = `<div class="empty">No sites match.</div>`;
    return;
  }
  // Groups keep the order they first appear in sites.json.
  const groups = new Map(sites.map((s) => [s.group, []]));
  shown.forEach((s) => groups.get(s.group).push(s));
  $("groups").innerHTML = [...groups].filter(([, list]) => list.length).map(([group, list]) =>
    `<h2>${esc(group)} · ${list.length}</h2><div class="list">${list.map(siteRow).join("")}</div>`).join("");
}

function renderUpdated() {
  if (!data) return;
  const stale = Date.now() - new Date(data.generatedAt) > STALE_MS;
  const el = $("updated");
  el.className = stale ? "meta warn" : "meta";
  el.textContent = stale
    ? `⚠ Last checked ${ago(data.generatedAt)}; checks may be delayed or stopped. See the Actions tab on GitHub.`
    : `Last checked ${ago(data.generatedAt)} · refreshes automatically`;
}

function render() {
  if (!data) return;
  renderUpdated();
  renderTotals(data.sites);
  renderToolbar(data.sites);
  renderSites(data.sites);
  const down = data.sites.filter((s) => s.status === "down").length;
  document.title = down ? `(${down} down) Puppy Dreams Status` : "Puppy Dreams Status";
}

async function load() {
  try {
    const res = await fetch(`data/summary.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    // Inventory data is optional: it only exists once Pinogy secrets are configured.
    inventory = await fetch(`data/inventory.json?t=${Date.now()}`, { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : inventory))
      .catch(() => inventory);
    // Only rebuild the page when a check has produced new data.
    const version = `${data.generatedAt}|${inventory?.generatedAt || ""}`;
    if (version !== lastVersion) {
      lastVersion = version;
      render();
    } else {
      renderUpdated();
    }
  } catch {
    if (!data) {
      $("updated").textContent = "No data yet — the first check hasn't run.";
      $("groups").innerHTML = `<div class="empty">Waiting for the first uptime check. Run the “Uptime check” workflow in GitHub Actions.</div>`;
    }
  }
}

$("toolbar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-filter]");
  if (!btn) return;
  filter = btn.dataset.filter;
  render();
});
// "toggle" doesn't bubble, so listen in the capture phase.
document.addEventListener("toggle", (e) => {
  const url = e.target.dataset?.url;
  if (url) e.target.open ? openDetails.add(url) : openDetails.delete(url);
}, true);
$("search").addEventListener("input", (e) => { query = e.target.value; render(); });

load();
setInterval(load, REFRESH_MS);
setInterval(renderUpdated, 30000); // keep the "Last checked" time current between loads
</script>
</body>
</html>
