name: Uptime check

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GitHub's minimum; runs can start a few minutes late)
  workflow_dispatch: # "Run workflow" button for an immediate check
  push:
    branches: [main]
    paths: [sites.json, index.html, scripts/**, .github/workflows/uptime.yml]

permissions:
  contents: write # commit check history
  issues: write # open/close downtime issues
  pages: write # publish the dashboard
  id-token: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check sites
        run: node scripts/check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save history
        run: |
          git config user.name "uptime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update uptime data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Prepare dashboard
        run: |
          mkdir -p _site
          cp -r index.html data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
